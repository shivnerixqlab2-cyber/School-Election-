// Drop-in replacement for the old window.storage API, backed by Firestore.
// Every key (config, votes:<id>, etc.) is stored as one document in the 'kv' collection.
const S = {
  async get(key, shared){
    const snap = await KV.doc(key).get();
    if(!snap.exists) throw new Error('not_found');
    return { key, value: snap.data().value, shared: !!shared };
  },
  async set(key, value, shared){
    await KV.doc(key).set({ value: value });
    return { key, value, shared: !!shared };
  },
  async delete(key, shared){
    await KV.doc(key).delete();
    return { key, deleted: true, shared: !!shared };
  },
  async list(prefix, shared){
    prefix = prefix || '';
    const snap = await KV
      .where(firebase.firestore.FieldPath.documentId(), '>=', prefix)
      .where(firebase.firestore.FieldPath.documentId(), '<', prefix + '\uf8ff')
      .get();
    return { keys: snap.docs.map(d => d.id), prefix, shared: !!shared };
  }
};

function showModal(message, opts){
  opts = opts || {};
  return new Promise(function(resolve){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box';
    const msgEl = document.createElement('p');
    msgEl.className = 'modal-msg';
    msgEl.textContent = message;
    box.appendChild(msgEl);
    const btnRow = document.createElement('div');
    btnRow.className = 'modal-btns';
    function close(result){
      if(overlay.parentNode) overlay.parentNode.removeChild(overlay);
      resolve(result);
    }
    if(opts.showCancel){
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn secondary';
      cancelBtn.textContent = t('modal_cancel');
      cancelBtn.onclick = function(){ close(false); };
      btnRow.appendChild(cancelBtn);
    }
    const okBtn = document.createElement('button');
    okBtn.className = 'btn' + (opts.danger ? ' danger' : '');
    okBtn.textContent = opts.okText || t('modal_ok');
    okBtn.onclick = function(){ close(true); };
    btnRow.appendChild(okBtn);
    box.appendChild(btnRow);
    overlay.appendChild(box);
    overlay.addEventListener('click', function(e){ if(e.target === overlay) close(false); });
    document.body.appendChild(overlay);
    okBtn.focus();
  });
}
function showAlert(message){ return showModal(message, {}); }
function showConfirm(message){ return showModal(message, {showCancel:true, danger:true}); }

async function loadConfig(){
  try{
    const r = await S.get('config', true);
    CONFIG = JSON.parse(r.value);
  }catch(e){
    CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    await S.set('config', JSON.stringify(CONFIG), true);
  }
  let migrated = false;
  if(!CONFIG.positions) CONFIG.positions = {};
  POSITIONS.forEach(p=>{

    if(v==='hi'||v==='en') LANG = v;
  }catch(e){}
}

function resizeImageFile(file, maxDim, quality, mime){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ()=>{
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else{ if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL(mime, quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function playBell(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const now = ctx.currentTime;
    [880, 1320, 1760].forEach((freq, i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(i===0?0.35:0.12, now+0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+3.2);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now+3.4);
    });
  }catch(e){}
}

function renderBallot(){
  const isStaff = voterState.role !== 'student';
  const houseCands = CONFIG.houseCaptains[voterState.house] || [];
  const houseObj = CONFIG.houses.find(h=>h.id===voterState.house);

  function optionsHtml(posKey, list){
    if(!list.length) return `<div class="empty">${t('empty_candidates')}</div>`;
    return list.map(c=>{
      const checked = voterState.selections[posKey] === c.id ? 'checked' : '';
      const photo = c.photo ? `<img class="opt-photo" src="${c.photo}">` : `<span class="opt-photo empty"></span>`;
      return `<label class="opt ${checked}">
        <input type="radio" name="${posKey}" value="${c.id}" ${checked}>
        ${photo}
        <span>${c.name}</span>
      </label>`;
    }).join('');
  }

  let positionsHtml = POSITIONS.map(p=>{
    return `<div class="position">
      <h3>${p.label[LANG]}</h3>
      <div class="opts" data-pos="${p.key}">${optionsHtml(p.key, CONFIG.positions[p.key])}</div>
    </div>`;
  }).join('');

  if(isStaff){
    CONFIG.houses.forEach(h=>{
      const posKey = 'houseCaptain_' + h.id;
      positionsHtml += `<div class="position">
        <h3><span class="house-tag" style="background:${h.color}"></span>${t('house_captain')} — ${h.name}</h3>
        <div class="opts" data-pos="${posKey}">${optionsHtml(posKey, CONFIG.houseCaptains[h.id] || [])}</div>
      </div>`;
    });
  } else {
    positionsHtml += `<div class="position">
      <h3>${t('house_captain')} — ${houseObj ? houseObj.name : ''}</h3>
      <p class="hint">${t('hint_house_only')}</p>
      <div class="opts" data-pos="houseCaptain">${optionsHtml('houseCaptain', houseCands)}</div>
    </div>`;
  }

  app.innerHTML = `
    <div class="masthead">
      ${logoHtml()}
      <span class="eyebrow">${t('eyebrow')}</span>
      <h1>${t('h1_ballot')}</h1>
      <p>${voterState.name}${houseObj ? ' · ' + houseObj.name : ''} · ${voterState.role==='student'?t('label_id_student'):t('label_id_staff')} ${voterState.roll}</p>
      <span class="weight-badge">${t(voterState.role==='student'?'role_student':(voterState.role==='teacher'?'role_teacher':'role_principal'))} · ${t('weight_note')} ${ROLE_WEIGHTS[voterState.role]}</span>
    </div>
    <div class="ballot"><div class="ballot-body">
      ${positionsHtml}
      <button class="btn" id="v-submit" style="margin-top:8px;">${t('btn_cast')}</button>
      <div class="stub">STUB · ${voterState.voteKey.toUpperCase()}</div>
    </div></div>
  `;

  document.querySelectorAll('.opts').forEach(group=>{
    group.addEventListener('change', (e)=>{
      const pos = group.getAttribute('data-pos');
      voterState.selections[pos] = e.target.value;
      group.querySelectorAll('.opt').forEach(o=>o.classList.remove('checked'));
      e.target.closest('.opt').classList.add('checked');
    });
  });

  document.getElementById('v-submit').onclick = async ()=>{
    const requiredPositions = isStaff
      ? [...POSITIONS.map(p=>p.key), ...CONFIG.houses.map(h=>'houseCaptain_'+h.id)]
      : [...POSITIONS.map(p=>p.key), 'houseCaptain'];
    const missing = requiredPositions.filter(k=>{
      let list;
      if(k==='houseCaptain') list = houseCands;
      else if(k.startsWith('houseCaptain_')) list = CONFIG.houseCaptains[k.replace('houseCaptain_','')] || [];
      else list = CONFIG.positions[k];
      return list.length>0 && !voterState.selections[k];
    });
    if(missing.length){ showAlert(t('alert_vote_all')); return; }
    const record = {
      name: voterState.name, roll: voterState.roll, house: voterState.house, role: voterState.role,
      weight: ROLE_WEIGHTS[voterState.role] || 1,
      selections: voterState.selections, time: new Date().toISOString()
    };
    try{
      const saveResult = await S.set(voterState.voteKey, JSON.stringify(record), true);
      if(!saveResult){ showAlert(t('alert_save_fail')); return; }
      const verify = await S.get(voterState.voteKey, true);
      if(!verify || !verify.value){ showAlert(t('alert_save_fail')); return; }
    }catch(e){ showAlert(t('alert_save_fail')); return; }
    voterState.step = 'confirm';
    renderVoter();
    playBell();
  };
}

function candidateListEditor(container, posKey, list, onChange){
  const rows = list.map(c=>`
    <div class="cand-row" data-id="${c.id}">
      <img class="cand-thumb" src="${c.photo || ''}" data-role="thumb" style="${c.photo?'':'background:var(--line);'}">
      <input type="file" class="photo-input" accept="image/*" data-role="fileinput">
      <input type="text" value="${c.name}" data-field="name">
      <button class="del" data-action="del" title="${t('remove')}">✕</button>
    </div>`).join('');
  container.innerHTML = `${rows}
    <div class="addrow">
      <input type="text" placeholder="${t('placeholder_new_cand')}" data-add-input>
      <button data-action="add">${t('btn_add')}</button>
    </div>`;
  container.querySelectorAll('.cand-row').forEach(row=>{
    const id = row.dataset.id;
    const cand = list.find(c=>c.id===id);
    row.querySelector('[data-field="name"]').addEventListener('input', (e)=>{ cand.name = e.target.value; onChange(); });
    const thumb = row.querySelector('[data-role="thumb"]');
    const fileInput = row.querySelector('[data-role="fileinput"]');
    thumb.addEventListener('click', ()=> fileInput.click());
    fileInput.addEventListener('change', async ()=>{
      if(!fileInput.files[0]) return;
      const dataUrl = await resizeImageFile(fileInput.files[0], 160, 0.82, 'image/jpeg');
      cand.photo = dataUrl;
      thumb.src = dataUrl;
      onChange();
    });
  });
  container.querySelectorAll('[data-action="del"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.closest('.cand-row').dataset.id;
      const idx = list.findIndex(c=>c.id===id);
      if(idx>-1){ list.splice(idx,1); onChange(); candidateListEditor(container,posKey,list,onChange); }
    });
  });
  const addBtn = container.querySelector('[data-action="add"]');
  const addInput = container.querySelector('[data-add-input]');
  addBtn.addEventListener('click', ()=>{
    const val = addInput.value.trim();
    if(!val) return;
    list.push({id: uid(), name: val, photo:null});
    onChange();
    candidateListEditor(container,posKey,list,onChange);
  });
  addInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ addBtn.click(); }});
}

  });
  const removeBtn = document.getElementById('logo-remove-btn');
  if(removeBtn) removeBtn.onclick = async ()=>{ CONFIG.schoolLogo=null; await saveConfig(); renderAdminCandidates(); };

  document.getElementById('pin-update-btn').onclick = async ()=>{
    const cur = document.getElementById('pin-current').value;
    const nw = document.getElementById('pin-new').value;
    const cf = document.getElementById('pin-confirm').value;
    const msg = document.getElementById('pin-update-msg');
    msg.style.color = 'var(--red)';
    if(cur !== CONFIG.adminPin){ msg.textContent = t('pin_wrong_current'); return; }
    if(!/^\d{4}$/.test(nw)){ msg.textContent = t('pin_invalid'); return; }
    if(nw !== cf){ msg.textContent = t('pin_mismatch'); return; }
    CONFIG.adminPin = nw;
    await saveConfig();
    msg.style.color = '#3E7A45';
    msg.textContent = t('pin_updated');
    document.getElementById('pin-current').value = '';
    document.getElementById('pin-new').value = '';
    document.getElementById('pin-confirm').value = '';
  };

  POSITIONS.forEach(p=>{
    const el = content.querySelector(`.editor[data-pos="${p.key}"]`);
    candidateListEditor(el, p.key, CONFIG.positions[p.key], saveConfig);
  });

  const houseEditor = document.getElementById('house-editor');
  houseEditor.innerHTML = CONFIG.houses.map(h=>`
    <div class="house-name-row" data-hid="${h.id}">
      <input type="color" value="${h.color}" data-field="color">
      <input type="text" value="${h.name}" data-field="name">
    </div>`).join('');
  houseEditor.querySelectorAll('.house-name-row').forEach(row=>{
    const hid = row.dataset.hid;
    const house = CONFIG.houses.find(h=>h.id===hid);
    row.querySelector('[data-field="name"]').addEventListener('input', (e)=>{ house.name=e.target.value; saveConfig(); });
    row.querySelector('[data-field="color"]').addEventListener('input', (e)=>{ house.color=e.target.value; saveConfig(); renderAdminCandidates(); });
  });

  CONFIG.houses.forEach(h=>{
    const el = content.querySelector(`.editor[data-house="${h.id}"]`);
    candidateListEditor(el, h.id, CONFIG.houseCaptains[h.id], saveConfig);
  });
}

async function renderAdminResults(){
  const content = document.getElementById('admin-content');
  content.innerHTML = `<p class="totalvotes">${t('loading_votes')}</p>`;
  let keys = [];
  try{
    const r = await S.list('votes:', true);
    keys = (r && r.keys) || [];
  }catch(e){}
  const records = [];
  for(const k of keys){
    try{
      const r = await S.get(k, true);
      records.push(JSON.parse(r.value));
    }catch(e){}
  }
  const totalWeighted = records.reduce((sum,r)=> sum + (r.weight||1), 0);
  content.innerHTML = `<p class="totalvotes">${t('total_voters')} <strong>${records.length}</strong> &nbsp;·&nbsp; ${t('total_weighted_votes')} <strong>${totalWeighted}</strong> · <button class="btn secondary" id="refresh" style="width:auto;padding:6px 12px;display:inline-block;">${t('btn_refresh')}</button> · <button class="btn secondary" id="clear-votes" style="width:auto;padding:6px 12px;display:inline-block;color:var(--red);border-color:var(--red);">${t('clear_votes')}</button></p><div id="result-blocks"></div>`;
  document.getElementById('refresh').onclick = renderAdminResults;
  document.getElementById('clear-votes').onclick = async ()=>{
    const ok = await showConfirm(t('clear_votes_confirm'));
    if(!ok) return;
    for(const k of keys){
      try{ await S.delete(k, true); }catch(e){}
    }
    await showAlert(t('votes_cleared'));
    renderAdminResults();
  };
  const blocks = document.getElementById('result-blocks');

  function tallyAndRender(title, candList, weightedVotesForPos){
    const counts = {};
    candList.forEach(c=>counts[c.id]=0);
    weightedVotesForPos.forEach(([v,w])=>{ if(counts[v]!==undefined) counts[v]+=w; });
    const max = Math.max(1, ...Object.values(counts));
    const div = document.createElement('div');
    div.className = 'result-block';
    let rowsHtml = candList.length ? candList.map(c=>{
      const cnt = counts[c.id]||0;
      const pct = Math.round((cnt/max)*100);
      return `<div class="bar-row"><div class="bar-name">${c.name}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="bar-count">${cnt}</div></div>`;
    }).join('') : `<div class="empty">${t('no_candidates')}</div>`;
    div.innerHTML = `<h4>${title}</h4>${rowsHtml}`;
    blocks.appendChild(div);
  }

  POSITIONS.forEach(p=>{
    const votes = records.filter(r=>r.selections[p.key]).map(r=>[r.selections[p.key], r.weight||1]);
    tallyAndRender(p.label[LANG], CONFIG.positions[p.key], votes);
  });

  CONFIG.houses.forEach(h=>{
    const studentVotes = records.filter(r=>r.role==='student' && r.house===h.id && r.selections.houseCaptain).map(r=>[r.selections.houseCaptain, r.weight||1]);
    const staffVotes = records.filter(r=>r.role!=='student' && r.selections['houseCaptain_'+h.id]).map(r=>[r.selections['houseCaptain_'+h.id], r.weight||1]);
    tallyAndRender(`${t('house_captain')} — ${h.name}`, CONFIG.houseCaptains[h.id], [...studentVotes, ...staffVotes]);
  });
}

async function renderAdminVotes(){
  const content = document.getElementById('admin-content');
  content.innerHTML = `<p class="totalvotes">${t('loading_votes')}</p>`;
  let keys = [];
  try{
    const r = await S.list('votes:', true);
    keys = (r && r.keys) || [];
  }catch(e){}
  const records = [];
  for(const k of keys){
    try{
      const r = await S.get(k, true);
      records.push({...JSON.parse(r.value), __key:k});
    }catch(e){}
  }
  records.sort((a,b)=> (b.time||'').localeCompare(a.time||''));

  content.innerHTML = `
    <input type="text" class="vote-search" id="vote-search" placeholder="${t('search_voter')}">
    <p class="totalvotes">${t('total_voters')} <strong id="vote-count">${records.length}</strong></p>
    <div id="vote-list"></div>
  `;

  function roleLabel(role){
    return role==='teacher' ? t('role_teacher') : (role==='principal' ? t('role_principal') : t('role_student'));
  }

  function renderList(filterText){
    const list = document.getElementById('vote-list');
    const q = (filterText||'').trim().toLowerCase();
    const filtered = q ? records.filter(r => (r.name||'').toLowerCase().includes(q) || (r.roll||'').toLowerCase().includes(q)) : records;
    document.getElementById('vote-count').textContent = filtered.length;
    if(!filtered.length){ list.innerHTML = `<div class="empty">${t('no_votes_yet')}</div>`; return; }
    const houseName = (hid)=> (CONFIG.houses.find(h=>h.id===hid)||{}).name || '';
    list.innerHTML = filtered.map(r=>{
      const when = r.time ? new Date(r.time).toLocaleString(LANG==='hi'?'hi-IN':'en-IN') : '';
      const houseTxt = r.house ? ' · ' + houseName(r.house) : '';
      return `<div class="vote-row" data-key="${r.__key}">
        <div>
          <div class="vname">${r.name || ''}</div>
          <div class="vmeta">${r.roll || ''} · ${roleLabel(r.role)} (${t('weight_note')} ${r.weight||1})${houseTxt} · ${when}</div>
        </div>
        <button class="del" data-action="del-vote" title="${t('remove')}">✕</button>
      </div>`;
    }).join('');
    list.querySelectorAll('[data-action="del-vote"]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const ok = await showConfirm(t('delete_vote_confirm'));
        if(!ok) return;
        const key = btn.closest('.vote-row').dataset.key;
        try{ await S.delete(key, true); }catch(e){}
        const idx = records.findIndex(rr=>rr.__key===key);
        if(idx>-1) records.splice(idx,1);
        await showAlert(t('vote_deleted'));
        renderList(document.getElementById('vote-search').value);
      });
    });
  }

  document.getElementById('vote-search').addEventListener('input', (e)=> renderList(e.target.value));
  renderList('');
}

// ---------- INIT ----------
(async function init(){
  app.innerHTML = `<p style="text-align:center;color:#5A6482;margin-top:60px;">Loading...</p>`;
  try{
    await KV.doc('__healthcheck__').set({ value: String(Date.now()) });
  }catch(e){
    console.error('Firebase connectivity check failed:', e);
    const detail = (e && (e.code || e.message)) ? String(e.code || e.message) : 'unknown error';
    app.innerHTML = `<div class="masthead" style="margin-top:60px;">
      <p style="color:var(--red);font-weight:600;font-size:15px;">${T.storage_unavailable.hi}</p>
      <p style="color:var(--red);font-weight:600;font-size:15px;margin-top:14px;">${T.storage_unavailable.en}</p>
      <p style="color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:18px;word-break:break-all;">DEBUG: ${detail}</p>
    </div>`;
    return;
  }
  await loadConfig();
  route();
})();
</script>
